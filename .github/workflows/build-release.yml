name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  verify:
    name: Build and verify
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build from source
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\dist-ci

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\dist-ci\TabWheel.exe").FileVersion
          if ($version -notmatch '^(\d+\.\d+\.\d+)\.0$') {
            throw "Unexpected file version: $version"
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify tests and release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version"
          }
          .\tests\VerifyRelease.ps1 `
            -Version $version `
            -BuiltExecutable .\dist-ci\TabWheel.exe `
            -ReleaseDirectory ".\releases\v$version"

      - name: Upload CI executable
        uses: actions/upload-artifact@v4
        with:
          name: TabWheel-ci-${{ steps.version.outputs.version }}
          path: dist-ci/TabWheel.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseDirectory = Join-Path $PWD "releases\$tag"
          gh release create $tag `
            (Join-Path $releaseDirectory "TabWheel-Windows-$tag.zip#Recommended ZIP package") `
            (Join-Path $releaseDirectory "TabWheel.exe#Standalone executable") `
            (Join-Path $releaseDirectory "SHA256SUMS.txt#SHA-256 checksums") `
            --verify-tag `
            --title "TabWheel $tag" `
            --notes-file (Join-Path $releaseDirectory "RELEASE_NOTES.md")
