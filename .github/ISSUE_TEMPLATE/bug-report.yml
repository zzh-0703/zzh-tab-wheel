name: Bug report
description: Report incorrect behavior or a browser compatibility problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, private URLs, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: TabWheel version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Microsoft Edge
        - Brave
        - Vivaldi
        - Opera
        - Other Chromium browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: 128.0.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain where the pointer was and what happened when the wheel was scrolled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add non-sensitive screenshots, display scaling, browser theme, or tab-layout details if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest published version.
          required: true
        - label: This report does not disclose a security vulnerability publicly.
          required: true
